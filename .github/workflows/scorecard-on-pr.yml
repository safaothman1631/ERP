# =============================================================================
# Scorecard on PR — lightweight maintainability delta
# scorecard لە PR — جیاوازی سادە لەگەڵ main
# =============================================================================
#
# What it does:
#   - Builds the PR branch + main branch.
#   - Compares: bundle size, file count, lint violation count, dead code.
#   - Posts a sticky comment with the delta (green = improvement, red =
#     regression). Non-blocking — informational only.
#
# Why "lightweight":
#   The full world-class-scorecard (scripts/world-class-scorecard.mjs) needs
#   live Sentry + RUM + GitHub Pulse data, which is heavy and only meaningful
#   post-deploy. This is a static "would this PR make things worse" check.
# =============================================================================

name: Scorecard on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "_deltas/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: scorecard-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Compute metrics for `main` (baseline) and for the PR HEAD.
  # ─────────────────────────────────────────────────────────────────────────
  baseline:
    name: Baseline (main)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      shell_kb:   ${{ steps.metrics.outputs.shell_kb }}
      total_kb:   ${{ steps.metrics.outputs.total_kb }}
      file_count: ${{ steps.metrics.outputs.file_count }}
      lint_count: ${{ steps.metrics.outputs.lint_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build (best-effort)
        run: npm run build || echo "::warning::main build failed; using zero baseline"
        continue-on-error: true

      - name: Compute baseline metrics
        id: metrics
        run: |
          set -e
          SHELL_KB=$(find dist -maxdepth 2 -name 'index-*.js' -printf '%s\n' 2>/dev/null | awk '{ s+=$1 } END { printf "%.0f", s/1024 }' || echo "0")
          TOTAL_KB=$(find dist -type f -name '*.js' -printf '%s\n' 2>/dev/null | awk '{ s+=$1 } END { printf "%.0f", s/1024 }' || echo "0")
          FILE_COUNT=$(find src -type f \( -name '*.ts' -o -name '*.tsx' \) | wc -l || echo "0")
          # ESLint is allowed to exit non-zero — we count warnings/errors regardless.
          LINT_COUNT=$(npx eslint . --format compact 2>/dev/null | grep -cE '(Error|Warning)' || echo "0")
          echo "shell_kb=${SHELL_KB}"     >> "$GITHUB_OUTPUT"
          echo "total_kb=${TOTAL_KB}"     >> "$GITHUB_OUTPUT"
          echo "file_count=${FILE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "lint_count=${LINT_COUNT}" >> "$GITHUB_OUTPUT"

  head:
    name: PR HEAD
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    outputs:
      shell_kb:   ${{ steps.metrics.outputs.shell_kb }}
      total_kb:   ${{ steps.metrics.outputs.total_kb }}
      file_count: ${{ steps.metrics.outputs.file_count }}
      lint_count: ${{ steps.metrics.outputs.lint_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build
        continue-on-error: true

      - name: Compute HEAD metrics
        id: metrics
        run: |
          set -e
          SHELL_KB=$(find dist -maxdepth 2 -name 'index-*.js' -printf '%s\n' 2>/dev/null | awk '{ s+=$1 } END { printf "%.0f", s/1024 }' || echo "0")
          TOTAL_KB=$(find dist -type f -name '*.js' -printf '%s\n' 2>/dev/null | awk '{ s+=$1 } END { printf "%.0f", s/1024 }' || echo "0")
          FILE_COUNT=$(find src -type f \( -name '*.ts' -o -name '*.tsx' \) | wc -l || echo "0")
          LINT_COUNT=$(npx eslint . --format compact 2>/dev/null | grep -cE '(Error|Warning)' || echo "0")
          echo "shell_kb=${SHELL_KB}"     >> "$GITHUB_OUTPUT"
          echo "total_kb=${TOTAL_KB}"     >> "$GITHUB_OUTPUT"
          echo "file_count=${FILE_COUNT}" >> "$GITHUB_OUTPUT"
          echo "lint_count=${LINT_COUNT}" >> "$GITHUB_OUTPUT"

  delta-comment:
    name: Post delta to PR
    needs: [baseline, head]
    runs-on: ubuntu-latest
    steps:
      - name: Compose delta table
        id: compose
        run: |
          BASE_SHELL=${{ needs.baseline.outputs.shell_kb }}
          HEAD_SHELL=${{ needs.head.outputs.shell_kb }}
          BASE_TOTAL=${{ needs.baseline.outputs.total_kb }}
          HEAD_TOTAL=${{ needs.head.outputs.total_kb }}
          BASE_FILES=${{ needs.baseline.outputs.file_count }}
          HEAD_FILES=${{ needs.head.outputs.file_count }}
          BASE_LINT=${{ needs.baseline.outputs.lint_count }}
          HEAD_LINT=${{ needs.head.outputs.lint_count }}

          # arrow function
          arrow() {
            local base=$1 head=$2
            local diff=$((head - base))
            if [[ $diff -gt 0 ]]; then echo "+${diff} 🔴"
            elif [[ $diff -lt 0 ]]; then echo "${diff} 🟢"
            else echo "0 ⚪"; fi
          }

          SHELL_ARROW=$(arrow "$BASE_SHELL" "$HEAD_SHELL")
          TOTAL_ARROW=$(arrow "$BASE_TOTAL" "$HEAD_TOTAL")
          FILES_ARROW=$(arrow "$BASE_FILES" "$HEAD_FILES")
          LINT_ARROW=$(arrow "$BASE_LINT" "$HEAD_LINT")

          {
            echo "## Maintainability delta vs \`main\`"
            echo ""
            echo "| Metric | main | this PR | Δ |"
            echo "|---|---:|---:|---:|"
            echo "| Shell bundle (KB)   | ${BASE_SHELL} | ${HEAD_SHELL} | ${SHELL_ARROW} |"
            echo "| Total JS (KB)       | ${BASE_TOTAL} | ${HEAD_TOTAL} | ${TOTAL_ARROW} |"
            echo "| Source files (ts/tsx) | ${BASE_FILES} | ${HEAD_FILES} | ${FILES_ARROW} |"
            echo "| Lint findings       | ${BASE_LINT}  | ${HEAD_LINT}  | ${LINT_ARROW} |"
            echo ""
            echo "<sub>🟢 improvement · 🔴 regression · ⚪ no change · 350 KB shell budget gate runs in CI</sub>"
          } > comment.md

      - uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment.md
          edit-mode: replace
