name: Backup verify

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GCS client
        run: pip install google-cloud-storage
      - name: Verify latest backup object
        env:
          BACKUP_GCS_BUCKET: ${{ secrets.BACKUP_GCS_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GCP_SA_KEY_PATH }}
        run: python backend/scripts/verify_latest_backup.py
