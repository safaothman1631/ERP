name: Mobile Android Beta (Play Internal)

# Spec ref: design.md §5.1, tasks.md T-G.5.5, T-G.5.11. Runs on push of a
# `mobile-v*` tag (e.g. `mobile-v1.4.1`). Builds a signed AAB and uploads
# it to the Play Console Internal Testing track via the `internal` lane.
# Promotion to Closed Beta or Production is a manual click in the Play
# Console (intentional — gates a human review of the build).

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to upload to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - beta
          - production

permissions:
  contents: read

jobs:
  android-beta:
    name: Build + upload AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mobile-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: mobile/android

      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install mobile deps + sync
        working-directory: mobile
        run: |
          npm ci --legacy-peer-deps
          npx cap sync android

      - name: Fastlane upload
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_JSON_KEY_BASE64: ${{ secrets.PLAY_JSON_KEY_BASE64 }}
        run: |
          LANE="${{ github.event.inputs.track || 'internal' }}"
          bundle exec fastlane "$LANE"

      - name: Upload AAB as artifact (audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab-${{ github.ref_name }}
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Trigger Firebase Test Lab pre-launch report
        # Test Lab pre-launch is invoked automatically by Play Console after
        # AAB upload; we tail the resulting report in
        # `mobile-pre-launch-report.yml`.
        run: echo "Test Lab pre-launch will be invoked by Play Console; see mobile-pre-launch-report.yml"
