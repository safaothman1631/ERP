name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify indexes + TTL manifest (pre-deploy)
        run: |
          python tools/verify_firestore_indexes.py
          python tools/verify_firestore_ttl.py
      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Firestore data project (NOT Cloud Run compute project)
          firebase deploy --only firestore:rules,firestore:indexes --project zoho-83cda --non-interactive
      - name: Post-deploy TTL manifest OK
        run: python tools/verify_firestore_ttl.py
