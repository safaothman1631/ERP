name: Weekly Health Check

# Runs every Monday 06:00 UTC (09:00 Baghdad) — fires `scripts/world-class-scorecard.mjs`
# and posts the resulting markdown to the sticky "World-Class Scorecard" issue.
#
# Manual trigger is supported via workflow_dispatch.
#
# References: validation.md §V-LM, T-V.8, T-V.11.

on:
  schedule:
    - cron: '0 6 * * 1'        # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate the scorecard but do not commit or post a comment'
        required: false
        default: 'false'

permissions:
  contents: write              # to commit the new scorecard.md
  issues: write                # to update the sticky issue
  pull-requests: read

env:
  SCORECARD_ISSUE_TITLE: 'World-Class Scorecard'

jobs:
  scorecard:
    name: Generate scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # doc-freshness uses `git log` per file

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python audit tools
        run: |
          python -m pip install --upgrade pip
          pip install radon vulture
        continue-on-error: true

      - name: Install Node audit tools (ts-prune)
        run: |
          npm i -g ts-prune@0.10.3 || echo "ts-prune install failed — graceful skip"
        continue-on-error: true

      - name: Install frontend deps (for ESLint, npm outdated)
        working-directory: frontend
        run: npm ci --no-audit --no-fund
        continue-on-error: true

      - name: Run radon (Python complexity)
        run: bash scripts/complexity-radon.sh
        continue-on-error: true

      - name: Generate scorecard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAINTAINABILITY_OFFLINE: '0'
        run: |
          node scripts/world-class-scorecard.mjs | tee scorecard-output.md

      - name: Upload scorecard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-health-check-${{ github.run_id }}
          path: |
            docs/world-class/scorecard.md
            audit/scorecards/scorecard-*.json
            audit/maintainability/
            audit/flakes/
            audit/complexity/
          retention-days: 90
          if-no-files-found: ignore

      - name: Commit scorecard updates
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/world-class/scorecard.md audit/scorecards/ audit/maintainability/ audit/flakes/ audit/complexity/ || true
          if git diff --cached --quiet; then
            echo "No scorecard changes to commit."
          else
            git commit -m "chore(scorecard): weekly health check $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Find or create sticky scorecard issue
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: find_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find an open issue whose title starts with the scorecard prefix.
          ISSUE_NUMBER=$(gh issue list --state open \
            --search "in:title \"$SCORECARD_ISSUE_TITLE\"" \
            --json number,title \
            --jq "[.[] | select(.title | startswith(\"$SCORECARD_ISSUE_TITLE\"))] | .[0].number // empty")
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_NUMBER=$(gh issue create \
              --title "$SCORECARD_ISSUE_TITLE" \
              --body "$(cat docs/world-class/scorecard.md)" \
              --label scorecard \
              | tail -n1 | grep -oE '[0-9]+$')
          fi
          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Update scorecard issue body
        if: ${{ github.event.inputs.dry_run != 'true' && steps.find_issue.outputs.issue_number != '' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.find_issue.outputs.issue_number }}
          body-path: docs/world-class/scorecard.md
          edit-mode: replace

      - name: Job summary
        run: |
          {
            echo "## World-Class Scorecard — $(date -u +%Y-%m-%d)"
            echo
            cat docs/world-class/scorecard.md
          } >> "$GITHUB_STEP_SUMMARY"
