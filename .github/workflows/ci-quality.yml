name: Quality (build + e2e + axe + lighthouse)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Required quality gate — RTL CSS audit (Requirement 10.9).
  # Scans all CSS/TSX/TS files for physical directional properties (left/right)
  # that should be replaced with logical properties (inline-start/inline-end).
  # Exempts tokens.ts. Fails the build if any violations are found.
  rtl-audit:
    name: RTL audit (no left/right CSS outside tokens.ts)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run rtl:audit
        run: npm run rtl:audit

  # Required quality gate — no UA / pointer-type sniffing in responsive layout
  # code (Requirements 4.1, 4.5, 4.7 of system-wide-ux-overhaul).
  # Forbids `navigator.userAgent`, `navigator.userAgentData`, and
  # `matchMedia('(pointer: coarse)')` inside frontend/src/components/responsive/**
  # and frontend/src/layouts/**. Decisions must go through useViewport().
  no-ua-layout-detection:
    name: No UA / pointer-type sniffing in responsive code
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run lint:no-ua
        run: npm run lint:no-ua

  # Required quality gate — Navigation 404 regression guard (Requirements 2.7, 3.6).
  # Runs the two-layer audit from `frontend/scripts/nav-audit.mjs`:
  #   - Layer 1: legacy structural side-nav check (preserves Requirement 3.6
  #     — the original `node scripts/nav-audit.mjs` invocation must keep exiting 0).
  #   - Layer 2: router-semantic match using `matchRoutes` from `react-router`
  #     against `navDestinations` × the route tree extracted from `App.routes.tsx`.
  # Failure of EITHER layer fails the build before merge.
  nav-audit:
    name: Nav audit (static + router-semantic)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24+ is required for native TypeScript stripping when the
          # audit dynamically imports `src/layouts/navDestinations.ts`.
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run nav:audit
        # `npm run nav:audit` invokes `node ./scripts/nav-audit.mjs`, which
        # runs Layer 1 (legacy) and Layer 2 (router-semantic) in one pass.
        # The legacy `node scripts/nav-audit.mjs` invocation is therefore
        # executed independently and continues to exit 0 (Requirement 3.6).
        run: npm run nav:audit

  # Required quality gate — runtime navigation sweep (Requirements 2.1–2.5, 2.7).
  # Builds the frontend, serves it via `vite preview`, signs in via the
  # existing Playwright auth fixture, walks every surface in `navDestinations`,
  # and asserts no destination renders the NotFound page.
  nav-sweep:
    name: Nav sweep (Playwright runtime)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      - name: Build app
        run: npm run build
      - name: Start preview server
        run: |
          npm run preview -- --port 5173 &
          npx wait-on http://localhost:5173
      - name: Run nav:sweep
        run: npm run nav:sweep
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nav-sweep-report
          path: frontend/playwright-report
          retention-days: 7

  # Required quality gate — Help registry coverage (Requirement 18.5).
  # Verifies that every Settings sub-section in the Help_Registry has
  # corresponding translation keys in both en.json and ku.json, and that
  # every Settings entry has ≥ 1 non-Settings relatesTo link (R7.3).
  # Runs on every PR (including PRs adding new routes); failures block merge.
  help-registry-coverage:
    name: Help registry coverage
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify help registry coverage
        run: npm run help:coverage

  # Required quality gate — i18n coverage (Requirements 7.2, 8.5, 13.1–13.3, 13.6, 13.7).
  # Enforces P1 (key-set parity) + P3 (help registry coverage) conditions:
  #   - Symmetric-difference check: en.json ⇔ ku.json identical key sets.
  #   - Rejects "", null, "TODO", "[missing]" values in either locale.
  #   - Every useHelp(id) / <HelpIcon sectionId="id"> in .tsx resolves in helpRegistry.
  #   - Every helpRegistry entry's translation keys exist in both locales.
  #   - howSteps.length ∈ [2, 7] for every registry entry.
  #   - Per-locale 100% gate (never average).
  i18n-coverage:
    name: i18n coverage (parity + help registry)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run i18n:coverage
        run: npm run i18n:coverage

  # Required quality gate — Route-walk end-to-end (Requirement 18.5).
  # Walks every entry in the route registry across viewports {320, 768, 1280}
  # × locales {en, ku} and asserts:
  #   P5 — No horizontal page overflow (scrollWidth ≤ clientWidth).
  #   P6 — Visible-text-node language matches active locale.
  #   P9 — Every Section has a Help_Icon; every Add-supporting Section uses useAddGate.
  # Runs on every PR (including PRs adding new routes); failures block merge.
  route-walk:
    name: Route-walk (viewports × locales)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      - name: Build app
        run: npm run build
      - name: Start preview server
        run: |
          npm run preview -- --port 5173 &
          npx wait-on http://localhost:5173
      - name: Run route-walk
        run: npm run route-walk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-walk-report
          path: frontend/playwright-report-nav-sweep
          retention-days: 7

  e2e-and-a11y:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run e2e:install
      - name: Build app
        run: npm run build
      - name: Start preview server
        run: |
          npm run preview -- --port 5173 &
          npx wait-on http://localhost:5173
      - name: Run Playwright + axe smoke
        run: npm run e2e
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Start preview server
        run: |
          npm run preview -- --port 5173 &
          npx wait-on http://localhost:5173
      - name: Lighthouse CI — Perf ≥ 85, A11y ≥ 95, LCP/CLS/INP thresholds
        # Requirements: 5.5, 14.8, 15.1, 15.2, 15.3, 15.4
        # Routes: /, /login, /dashboard, /settings, /sales/invoices
        # Thresholds enforced via lighthouserc.json:
        #   - Performance ≥ 85, Accessibility ≥ 95 (all routes)
        #   - LCP ≤ 2.5s (/ and /login)
        #   - CLS ≤ 0.1 (all routes)
        #   - INP ≤ 200ms (/dashboard and /sales/invoices)
        run: npm run lhci
      - name: No-regression check vs perf-baseline.json
        # Requirements: 15.1, 15.2, 15.3, 15.4
        # Fails if any route's Performance score dropped by more than 3 points
        # compared to the baseline in frontend/perf-baseline.json.
        # Routes with null baseline are skipped (only absolute floors apply).
        run: node scripts/lighthouse-no-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7
