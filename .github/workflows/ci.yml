name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile-check
        working-directory: backend
        run: |
          python -m compileall -q app
      - name: Import-check
        working-directory: backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ""
        run: |
          python - <<'PY'
          import os, sys
          # Skip Firebase init by mocking module before import
          sys.path.insert(0, '.')
          os.environ.setdefault("ALLOW_UNAUTH_IMPORT", "1")
          try:
              from app import main  # noqa
              print("Import OK,", len(main.app.routes), "routes")
          except Exception as e:
              print("Import error (expected without Firebase creds):", e)
          PY
      - name: Shopkeeper core tests
        working-directory: backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ""
          ALLOW_UNAUTH_IMPORT: "1"
        run: |
          python -m pytest tests/test_pos_inventory_qty.py tests/test_shopkeeper_core_flow.py tests/test_banking_reconciliation_summary.py tests/test_pos_accounting.py tests/test_bank_match_payment.py tests/test_shopkeeper_api_integration.py -q --tb=line
      - name: Verify Firestore indexes manifest
        run: python tools/verify_firestore_indexes.py
      - name: Verify Firestore TTL overrides
        run: python tools/verify_firestore_ttl.py
      - name: Firestore repository audit (B5)
        run: python tools/firestore_audit.py
      - name: Region alignment (G5)
        run: python tools/verify_region_alignment.py
      - name: Firestore naming lint (Wave N)
        run: python backend/tools/lint_naming.py
      - name: Firestore field types lint (Wave V)
        run: python backend/tools/lint_field_types.py
      - name: PII coverage audit (Wave E)
        run: python backend/scripts/audit_pii_coverage.py
      - name: Pytest
        working-directory: backend
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ""
          ALLOW_UNAUTH_IMPORT: "1"
        run: |
          python -m pytest tests/ -q --tb=line --maxfail=5

  e2e-scenarios:
    name: E2E Business Scenarios
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Business scenario smoke tests
        run: npx playwright test e2e/scenarios/ --reporter=line

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint . --max-warnings 9999 || true
      - name: i18n Completeness & Localization
        # Blocks deployment if any locale is missing keys or has key parity issues.
        # Requirements: 20.1–20.7
        run: npx vitest run src/locales/i18n.integration.test.ts --reporter=verbose
      - name: Build
        run: npm run build

  lighthouse-a11y:
    name: Lighthouse Accessibility (≥ 95)
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x
      - name: Serve built app
        run: npx serve -s dist -l 5173 &
        # Wait for server to be ready
      - name: Wait for server
        run: npx wait-on http://localhost:5173 --timeout 30000
      - name: Run Lighthouse CI
        run: lhci autorun --config=lighthouserc.json
        # Blocks deployment if accessibility score < 0.95 (Requirement 17.8)
        # lighthouserc.json asserts: "categories:accessibility": ["error", { "minScore": 0.95 }]
