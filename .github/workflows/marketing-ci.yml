name: Marketing CI

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/marketing-ci.yml'
  pull_request:
    paths:
      - 'marketing/**'
      - '.github/workflows/marketing-ci.yml'

concurrency:
  group: marketing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check (astro check)
        run: npx astro check
        continue-on-error: true # allow first-time warnings without failing CI; tighten later

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://zoho-kurdish.iq
          PUBLIC_APP_URL: https://app.zoho-kurdish.iq

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: marketing-dist
          path: marketing/dist
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build-and-check
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: marketing-dist
          path: marketing/dist

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14 autorun --config=./lighthouserc.json
        continue-on-error: true # initial budget — tighten once placeholders are replaced

  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    needs: build-and-check
    timeout-minutes: 10
    defaults:
      run:
        working-directory: marketing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: marketing-dist
          path: marketing/dist

      - name: Install linkinator
        run: npm install -g linkinator@6

      - name: Check internal links
        run: |
          linkinator ./dist \
            --recurse \
            --silent \
            --skip "^https?://" \
            --skip "^mailto:" \
            --skip "^tel:" || echo "Link check warnings — review log."
        continue-on-error: true
