name: Deploy to Cloud Run

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SERVICE: zoho-erp
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # for keyless auth via Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation (keyless — no JSON secret needed)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Prepare Cloud Run env file
        run: |
          cat > cloudrun-env.yaml <<'EOF'
          ENVIRONMENT: production
          APP_NAME: Zoho ERP
          CORS_ORIGINS: https://erpiq.systems,https://www.erpiq.systems
          EOF

      - name: Build & deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --env-vars-file cloudrun-env.yaml \
            --set-secrets "SECRET_KEY=zoho-secret-key:latest"

      - name: Show service URL
        run: gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)'
