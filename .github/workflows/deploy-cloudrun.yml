name: Deploy to Cloud Run

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

env:
  # Canonical production backend: the service the frontend's /api/* rewrite
  # targets (zoho-erp-backend-6plfqh2hiq-ew.a.run.app, europe-west1). Keep in
  # lock-step with deploy/redeploy-backend.ps1 (same region + secrets).
  SERVICE: zoho-erp-backend
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build & deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --env-vars-file cloudrun-deploy-env.yaml \
            --set-secrets "SECRET_KEY=zoho-secret-key:latest,FIELD_ENCRYPTION_KEY=field-encryption-key:latest,SENTRY_DSN=sentry-dsn:latest"
      - name: Attach VPC + Redis rate-limit (when secret exists)
        continue-on-error: true
        run: |
          gcloud run services update "$SERVICE" \
            --region "$REGION" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --vpc-connector=erpiq-run-connector \
            --vpc-egress=private-ranges-only \
            --update-secrets "RATE_LIMIT_STORAGE_URI=redis-rate-limit-uri:latest"

      - name: Show service URL
        run: gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)'
