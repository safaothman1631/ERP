name: Mobile iOS Debug Build

# Spec ref: design.md §5.1, tasks.md T-G.5.6. Runs on PR to catch iOS
# build breakage early. Requires a macOS runner (Apple's xcodebuild only
# runs on macOS). The debug lane uses the development Match profile
# (readonly mode) so PRs don't accidentally rotate signing material.

on:
  pull_request:
    paths:
      - "mobile/**"
      - "frontend/**"
      - ".github/workflows/mobile-ios-debug.yml"
  workflow_dispatch:

jobs:
  ios-debug:
    name: Build debug .app
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: mobile/ios

      - name: Select Xcode 15.4
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Install + build frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install mobile deps + sync iOS
        working-directory: mobile
        run: |
          npm ci --legacy-peer-deps
          npx cap sync ios

      - name: CocoaPods install
        working-directory: mobile/ios/App
        run: pod install --repo-update

      - name: Fastlane debug
        working-directory: mobile/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTH_BASE64: ${{ secrets.MATCH_GIT_BASIC_AUTH_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_READONLY: "true"
        run: bundle exec fastlane debug
