version: "3.9"

services:
  backend:
    build: ./backend
    container_name: zoho_backend
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/serviceAccountKey.json
      - PORT=8000
    volumes:
      - ./backend/serviceAccountKey.json:/app/serviceAccountKey.json:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: zoho_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
