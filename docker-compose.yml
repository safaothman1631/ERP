version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: zoho_postgres
    environment:
      POSTGRES_DB: zoho_books
      POSTGRES_USER: zoho
      POSTGRES_PASSWORD: zoho_local_2024
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
