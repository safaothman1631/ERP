[pytest]
asyncio_mode = auto
testpaths = tests
# Coverage measurement (pytest-cov). --cov-fail-under=0 means coverage is
# REPORTED but never fails the build; raise the floor over time as more of
# app/ gets real unit coverage.
addopts =
    --cov=app
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=0
filterwarnings =
    ignore::DeprecationWarning
