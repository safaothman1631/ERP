repos:
  - repo: local
    hooks:
      - id: firestore-naming-lint
        name: Firestore naming lint
        entry: python backend/tools/lint_naming.py
        language: system
        pass_filenames: false
      - id: firestore-field-types-lint
        name: Firestore field types lint
        entry: python backend/tools/lint_field_types.py
        language: system
        pass_filenames: false

  # ── SF4 / T-SF.4.20: secret scanning ──────────────────────────────────────
  # Blocks commits that introduce credentials. Uses the repo-root
  # .gitleaks.toml (default ruleset + project detectors + allowlist).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        args: ["protect", "--staged", "--config", ".gitleaks.toml", "--no-banner", "--redact"]
